name: Restore sharp Storeman logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-technical-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original high-resolution logo assets
        run: |
          git checkout a5d2c92f5b410b6aa5e3988b2df673559a5e3606 -- assets/storemanlogo.jpg assets/footerlogo.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/storemanlogo.jpg assets/footerlogo.jpg
          if git diff --cached --quiet; then
            echo 'Sharp logo assets are already restored.'
          else
            git commit -m 'Restore original high-resolution Storeman logos'
            git push origin main
          fi
