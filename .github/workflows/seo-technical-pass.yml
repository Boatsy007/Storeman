name: Storeman SEO technical pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-technical-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair and finish technical SEO markup
        run: |
          cat > /tmp/storeman_seo_repair.py <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              if path.name == 'estimate.html':
                  continue
              text = path.read_text(encoding='utf-8')
              # Repair the control character produced by the first one-time pass.
              text = text.replace('\x01', '</head>')
              # Ensure the shared structured-data helper is loaded on every indexable HTML page.
              if '/seo.js' not in text and '</head>' in text.lower():
                  idx = text.lower().find('</head>')
                  text = text[:idx] + '  <script src="/seo.js" defer></script>\n' + text[idx:]
              path.write_text(text, encoding='utf-8')
          PY
          python /tmp/storeman_seo_repair.py
      - name: Validate HTML heads and SEO helper
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('.').glob('*.html'):
              if p.name == 'estimate.html':
                  continue
              t=p.read_text(encoding='utf-8')
              if '</head>' not in t.lower() or '/seo.js' not in t or '\x01' in t:
                  bad.append(p.name)
          if bad:
              raise SystemExit('SEO validation failed: ' + ', '.join(bad))
          print('Validated all indexable HTML pages.')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
          else
            git commit -m 'Repair HTML heads and finish SEO helper rollout'
            git push origin main
          fi
