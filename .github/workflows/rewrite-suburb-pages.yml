            'slacks-creek': {
              'name':'Slacks Creek','focus':'commercial and industrial properties','image':'sweeping.jpg',
              'hero':'Commercial sweeping and recurring grounds maintenance for Slacks Creek businesses, yards and managed properties.',
              'intro1':'Slacks Creek commercial properties can include paved service areas, carparks, yards and landscaped frontage. Those areas benefit from a maintenance plan that addresses both hard surfaces and grounds presentation.',
