name: Rewrite Storeman suburb pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rewrite-suburb-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite 15 suburb landing pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape

          pages = {
            'stapylton': {
              'name':'Stapylton','focus':'industrial and warehouse properties','image':'sweeping.jpg',
              'hero':'Commercial sweeping, grounds maintenance and lawn & garden care for Stapylton warehouses, hardstands, yards and managed commercial sites.',
