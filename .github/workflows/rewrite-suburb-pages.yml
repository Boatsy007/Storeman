              'sites':['COMMERCIAL SITES','MANAGED PROPERTIES','CARPARKS','LARGE GROUNDS'],
              'faq':('Do you provide one-off work as well as recurring service in Nerang?','Yes. Storeman can quote one-off work, although the business is particularly suited to recurring commercial maintenance schedules.')},
            'beenleigh': {
              'name':'Beenleigh','focus':'commercial, industrial and strata properties','image':'sweeping.jpg',
              'hero':'Commercial sweeping, grounds maintenance and lawn & garden care for Beenleigh businesses and managed sites.',
              'intro1':'Beenleigh commercial sites can combine customer-facing areas, carparks, service access and landscaped grounds. Storeman gives property managers a simple way to coordinate those core outdoor maintenance requirements.',
              'intro2':'Depending on the property, a recurring visit can include mechanical sweeping, mowing, edging, trimming and general grounds presentation without needing separate contractors for each task.',
              'sites':['COMMERCIAL PREMISES','INDUSTRIAL PROPERTY','STRATA & COMMON AREAS','CARPARKS & GROUNDS'],
              'faq':('Can multiple Storeman services be combined in Beenleigh?','Yes. Sweeping, grounds maintenance and lawn & garden care can be combined where that suits the property and service schedule.')},
            'loganholme': {
              'name':'Loganholme','focus':'commercial, retail and industrial properties','image':'sweeping.jpg',
              'hero':'Recurring commercial property maintenance in Loganholme for carparks, hard surfaces, grounds and landscaped areas.',
              'intro1':'Loganholme businesses and larger managed properties often have several outdoor maintenance needs happening at once. Storeman is built around consolidating the core work rather than adding another layer of contractor coordination.',
              'intro2':'Mechanical sweeping keeps suitable paved areas and carparks under control, while grounds maintenance and lawn & garden care maintain grassed areas, edges and landscaped presentation.',
              'sites':['COMMERCIAL SITES','RETAIL PROPERTY','INDUSTRIAL AREAS','CARPARKS & LANDSCAPING'],
