              'faq':('Can you service strata and managed properties in Arundel?','Yes. Storeman can quote suitable strata, body corporate and managed commercial properties for recurring outdoor maintenance.')},
            'burleigh-heads': {
              'name':'Burleigh Heads','focus':'commercial, retail and industrial properties','image':'grounds.jpg',
              'hero':'Commercial sweeping and outdoor grounds maintenance for Burleigh Heads businesses, retail sites and managed properties.',
              'intro1':'Burleigh Heads includes busy commercial areas where first impressions matter, as well as larger properties with carparks, paved access and landscaped frontage. Storeman keeps the core outdoor maintenance under one service arrangement.',
              'intro2':'Sweeping can help manage loose debris across hard surfaces, while lawn and garden work keeps edges, grassed areas and landscaped sections presentable on a recurring schedule.',
              'sites':['RETAIL & COMMERCIAL','CARPARKS','BUSINESS PREMISES','LANDSCAPED FRONTAGE'],
              'faq':('Can Storeman work around busy trading periods?','Where access and scheduling allow, we can discuss service times that reduce disruption to customers, staff and normal site operations.')},
            'nerang': {
              'name':'Nerang','focus':'commercial and managed properties','image':'grounds.jpg',
              'hero':'Commercial grounds maintenance, lawn & garden care and mechanical sweeping for Nerang properties.',
              'intro1':'Nerang businesses and managed properties can include large outdoor areas, carparks and landscaped boundaries that need regular upkeep. Storeman combines the practical outdoor services that keep those areas under control.',
