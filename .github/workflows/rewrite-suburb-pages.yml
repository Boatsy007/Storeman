              'name':'Coomera','focus':'commercial, retail and managed properties','image':'grounds.jpg',
              'hero':'Commercial sweeping, grounds maintenance and lawn & garden care for Coomera businesses, managed properties and larger sites.',
              'intro1':'Coomera commercial properties can have a mix of carparks, landscaped entries, grassed areas and shared outdoor spaces. Storeman focuses on keeping those areas consistently maintained rather than treating each task as a separate job.',
