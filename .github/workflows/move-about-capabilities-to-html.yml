name: Move About and capability content into HTML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-about-capabilities-to-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move SEO-critical About and capability content into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          script = Path('script.js')
          html = index.read_text(encoding='utf-8')
          js = script.read_text(encoding='utf-8')

          # Add About link directly to the primary/footer navigation.
          html = html.replace(
              '<a href="#who">Who We Serve</a><a href="#why">Why Storeman</a>',
              '<a href="#who">Who We Serve</a><a href="#about">About</a><a href="#why">Why Storeman</a>'
          )
          html = html.replace(
              '<a href="#who">Who We Serve</a><a href="#why">Why Storeman</a><a href="/areas.html">Areas</a>',
              '<a href="#who">Who We Serve</a><a href="#about">About</a><a href="#why">Why Storeman</a><a href="/areas.html">Areas</a>'
          )

          about = '''\n  <section class="about-storeman" id="about">\n    <div class="container about-storeman-inner">\n      <div class="about-storeman-copy">\n        <p class="label">ABOUT STOREMAN</p>\n        <h2>ONE TEAM.<br><span>SMARTER SITE MAINTENANCE.</span></h2>\n        <p>Storeman was built to make commercial property maintenance simpler. Property managers and business owners should not need separate contractors for sweeping, grounds and lawn care.</p>\n        <p>We bring mechanical sweeping, grounds maintenance and lawn &amp; garden care together under one service. That means fewer suppliers to manage, clearer communication and a more consistent standard across the site.</p>\n        <button class="button button-yellow quote-trigger about-quote-trigger" type="button">GET YOUR FREE QUOTE <span>→</span></button>\n      </div>\n      <div class="about-storeman-panel">\n        <div><b>01</b><strong>ONE POINT OF CONTACT</strong><span>Less contractor juggling. One team coordinating the core outdoor maintenance.</span></div>\n        <div><b>02</b><strong>BUILT AROUND THE SITE</strong><span>Sweeping, grounds and lawn care can be combined around what the property actually needs.</span></div>\n        <div><b>03</b><strong>CONSISTENT PRESENTATION</strong><span>Recurring maintenance keeps carparks, grounds and landscaped areas working to one standard.</span></div>\n        <div><b>04</b><strong>LOCAL SEQ SERVICE</strong><span>Focused across the Gold Coast, Yatala, Logan, Brisbane and surrounding areas.</span></div>\n      </div>\n    </div>\n  </section>\n'''

          # Insert About directly after Who We Serve if not already static.
          if 'class="about-storeman" id="about"' not in html:
              marker = '\n  <section class="why" id="why">'
              if marker not in html:
                  raise SystemExit('Could not find Why Storeman section insertion point')
              html = html.replace(marker, about + marker, 1)

          capabilities = '''\n  <section class="industries" id="capabilities">\n    <div class="container">\n      <div class="section-heading"><div><p class="label">MORE OF WHAT WE DO</p><h2>THREE CORE SERVICES. ONE STOREMAN TEAM.</h2></div><button class="link-btn quote-trigger" type="button">GET YOUR FREE QUOTE <span>→</span></button></div>\n      <div class="capability-grid">\n        <a class="capability-tile" href="/sweeping.html"><img src="/assets/sweeping.jpg" alt="Storeman sweeping service" loading="lazy"><span>SWEEPING</span></a>\n        <a class="capability-tile" href="/grounds.html"><img src="/assets/grounds.jpg" alt="Storeman grounds service" loading="lazy"><span>GROUNDS</span></a>\n        <a class="capability-tile" href="/lawn-garden.html"><img src="/assets/mowing.jpg" alt="Storeman lawn and garden service" loading="lazy"><span>LAWN &amp; GARDEN</span></a>\n      </div>\n    </div>\n  </section>'''

          html, n = re.subn(
              r'\n  <section class="industries" id="industries">.*?</section>',
              capabilities,
              html,
              count=1,
              flags=re.S
          )
          if n != 1 and 'id="capabilities"' not in html:
              raise SystemExit('Could not replace industries/capabilities section')

          # Remove JS that creates/replaces capabilities content. Leave the styling block in JS for visual parity.
          js = re.sub(
              r'const showcase = document\.querySelector\(\'\.industries\'\);\nif \(showcase\) \{.*?document\.head\.appendChild\(style\);\n\}\n\n',
              '''const showcase = document.querySelector('.industries');\nif (showcase) {\n  const style = document.createElement('style');\n  style.textContent = `.capability-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.capability-tile{position:relative;height:180px;overflow:hidden;background:#ddd;display:block}.capability-tile img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}.capability-tile:after{content:"";position:absolute;inset:38% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.84))}.capability-tile span{position:absolute;z-index:2;left:14px;bottom:12px;color:#fff;font-family:"Archivo Black",sans-serif;font-size:15px;line-height:1}.capability-tile:hover img{transform:scale(1.035)}@media(max-width:980px){.capability-grid{grid-template-columns:repeat(2,1fr)}.capability-tile{height:180px}}@media(max-width:620px){.capability-grid{grid-template-columns:1fr}.capability-tile{height:220px}}`;\n  document.head.appendChild(style);\n}\n\n''',
              js,
              count=1,
              flags=re.S
          )

          # Remove JS-created About section/nav links, retaining only About styles.
          js = re.sub(
              r'// Short company context:.*?const aboutStyle = document\.createElement\(\'style\'\);\n  aboutStyle\.textContent = (`.*?`);\n  document\.head\.appendChild\(aboutStyle\);\n\}\n',
              lambda m: "// About content now lives in index.html; retain its presentation styles here.\nconst aboutStyle = document.createElement('style');\naboutStyle.textContent = " + m.group(1) + ";\ndocument.head.appendChild(aboutStyle);\n",
              js,
              count=1,
              flags=re.S
          )

          # If the regex above misses due to formatting drift, remove the DOM creation block more conservatively.
          if "const whoSection = document.querySelector('.who-we-serve');" in js:
              start = js.index("// Short company context:") if "// Short company context:" in js else js.index("const whoSection = document.querySelector('.who-we-serve');")
              end_marker = "const whySection = document.querySelector('.why');"
              end = js.index(end_marker, start)
              block = js[start:end]
              style_match = re.search(r'aboutStyle\.textContent = (`.*?`);', block, flags=re.S)
              replacement = ''
              if style_match:
                  replacement = "// About content now lives in index.html; retain its presentation styles here.\nconst aboutStyle = document.createElement('style');\naboutStyle.textContent = " + style_match.group(1) + ";\ndocument.head.appendChild(aboutStyle);\n\n"
              js = js[:start] + replacement + js[end:]

          index.write_text(html, encoding='utf-8')
          script.write_text(js, encoding='utf-8')
          PY

      - name: Validate static homepage content and links
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('script.js').read_text(encoding='utf-8')
          required = [
              'id="about"', 'href="#about"',
              'id="capabilities"',
              'href="/sweeping.html"', 'href="/grounds.html"', 'href="/lawn-garden.html"',
              'ONE TEAM.<br><span>SMARTER SITE MAINTENANCE.</span>',
              'THREE CORE SERVICES. ONE STOREMAN TEAM.'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing static homepage content: ' + ', '.join(missing))
          banned_js = [
              "aboutSection.innerHTML",
              "grid.innerHTML = `<a class=\"capability-tile\"",
              "headerWho.insertAdjacentHTML",
              "footerWho.insertAdjacentHTML"
          ]
          remaining = [x for x in banned_js if x in js]
          if remaining:
              raise SystemExit('SEO-critical content still created in JS: ' + ', '.join(remaining))
          print('About and capability content/links are now present in static HTML.')
          PY

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          if git diff --cached --quiet; then
            echo 'No migration required.'
          else
            git commit -m 'Move About and capability links into homepage HTML'
            git push origin main
          fi