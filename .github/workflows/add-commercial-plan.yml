name: Apply commercial homepage plan

on:
  push:
    paths:
      - '.github/workflows/add-commercial-plan.yml'
      - 'scripts/add-commercial-plan.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage
        run: python scripts/add-commercial-plan.py
      - name: Commit homepage
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes required"
            exit 0
          fi
          git config user.name "Storeman Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add recurring commercial service plan to homepage"
          git push
