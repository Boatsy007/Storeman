name: Apply flyer-inspired homepage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Link flyer homepage stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '  <link rel="stylesheet" href="/flyer-home.css" />\n'
          if '/flyer-home.css' not in s:
              marker = '  <link rel="stylesheet" href="/layout-polish.css" />\n'
              if marker not in s:
                  raise SystemExit('layout-polish.css marker not found')
              s = s.replace(marker, marker + tag, 1)
              p.write_text(s)
          PY
      - name: Validate technical foundation remains intact
        run: |
          grep -q 'href="/flyer-home.css"' index.html
          grep -q '<script src="/seo.js" defer></script>' index.html
          grep -q 'id="services"' index.html
          grep -q 'id="about"' index.html
          grep -q 'id="capabilities"' index.html
          grep -q 'href="/sweeping.html"' index.html
          grep -q 'href="/grounds.html"' index.html
          grep -q 'href="/lawn-garden.html"' index.html
          grep -q 'quote-trigger' index.html
      - name: Remove one-off workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-flyer-home.yml
          git add index.html flyer-home.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Give homepage Storeman flyer visual treatment"
          git push
