name: Apply premium STOREMAN homepage UX

on:
  push:
    paths:
      - '.github/workflows/premium-homepage-ux.yml'
      - 'scripts/premium_homepage_upgrade.py'
      - 'premium-home.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit and safely upgrade homepage
        run: python3 scripts/premium_homepage_upgrade.py

      - name: Commit homepage upgrade
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes required"
            exit 0
          fi
          git config user.name "Storeman Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade homepage to complete exterior care positioning"
          git push
